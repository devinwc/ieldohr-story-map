const MAP_NATURAL_W = 2048;
const MAP_NATURAL_H = 1536;

const PALETTE = ["#e0555f", "#e8a33d", "#4fb8a0", "#5c8be0", "#b47ede", "#e07ab0", "#8fd15a", "#d9c23d"];

const emptyData = {
  locations: [],   // {id, name, x, y} — named nodes
  junctions: [],   // {id, x, y} — unnamed fork points along the path network
  segments: [],    // {id, name, fromNodeId, toNodeId, points:[{x,y}], miles}
  calibration: null,
  characters: [],  // {id, name, color}
  points: [],      // {id, characterId, locationId, startDay, endDay, note}
  timelineDays: 180,
  timelineUnit: "days", // days | weeks | months
  travelModes: [
    { id: "walking", name: "Walking", speed: 20, segType: "land" },
    { id: "horseback", name: "Horseback", speed: 40, segType: "land" },
    { id: "ship", name: "Ship", speed: 35, segType: "sea" },
    { id: "airship", name: "Airship", speed: 150, segType: "air" },
  ],
};

function migrateData(raw) {
  const d = { ...emptyData, ...raw };
  // older saves used a flat "routes" array of point-to-point paths — convert those to segments once
  if ((!d.segments || d.segments.length === 0) && Array.isArray(raw.routes) && raw.routes.length > 0) {
    d.segments = raw.routes.map((r) => ({ id: r.id, name: r.name, fromNodeId: r.fromId, toNodeId: r.toId, points: r.points, miles: r.miles }));
  }
  if (!d.junctions) d.junctions = [];
  return d;
}

function dist(p1, p2) {
  const dx = ((p1.x - p2.x) / 100) * MAP_NATURAL_W;
  const dy = ((p1.y - p2.y) / 100) * MAP_NATURAL_H;
  return Math.sqrt(dx * dx + dy * dy);
}
function routeLengthPx(pts) { let t = 0; for (let i = 1; i < pts.length; i++) t += dist(pts[i - 1], pts[i]); return t; }
function pointAtFraction(pts, t) {
  const segLens = []; let total = 0;
  for (let i = 1; i < pts.length; i++) { const d = dist(pts[i - 1], pts[i]); segLens.push(d); total += d; }
  if (total === 0) return pts[0];
  let target = t * total;
  for (let i = 0; i < segLens.length; i++) {
    if (target <= segLens[i] || i === segLens.length - 1) {
      const frac = segLens[i] === 0 ? 0 : Math.min(target / segLens[i], 1);
      const a = pts[i], b = pts[i + 1];
      return { x: a.x + (b.x - a.x) * frac, y: a.y + (b.y - a.y) * frac };
    }
    target -= segLens[i];
  }
  return pts[pts.length - 1];
}
// closest point on a polyline to pt, in the same % coordinate space used for snapping
function nearestPointOnPolyline(pt, pts) {
  let best = { d: Infinity, point: pts[0], segIndex: 0 };
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const abx = b.x - a.x, aby = b.y - a.y;
    const len2 = abx * abx + aby * aby;
    let t = len2 === 0 ? 0 : ((pt.x - a.x) * abx + (pt.y - a.y) * aby) / len2;
    t = Math.max(0, Math.min(1, t));
    const proj = { x: a.x + abx * t, y: a.y + aby * t };
    const d = Math.hypot(proj.x - pt.x, proj.y - pt.y);
    if (d < best.d) best = { d, point: proj, segIndex: i - 1 };
  }
  return best;
}

// ---- path network (locations + junctions connected by segments) ----------
function nodeById(data, id) {
  const loc = data.locations.find((l) => l.id === id);
  if (loc) return loc;
  return (data.junctions || []).find((j) => j.id === id) || null;
}
function buildGraph(data) {
  const adj = {};
  (data.segments || []).forEach((seg) => {
    const w = seg.miles != null ? seg.miles : routeLengthPx(seg.points) * (data.calibration ? data.calibration.milesPerPixel : 0.05);
    (adj[seg.fromNodeId] = adj[seg.fromNodeId] || []).push({ to: seg.toNodeId, w, segmentId: seg.id, reversed: false });
    (adj[seg.toNodeId] = adj[seg.toNodeId] || []).push({ to: seg.fromNodeId, w, segmentId: seg.id, reversed: true });
  });
  return adj;
}
// returns ordered list of {segmentId, reversed} hops from fromId to toId, or null if unreachable
function shortestPath(data, fromId, toId) {
  if (fromId === toId) return [];
  const adj = buildGraph(data);
  const distMap = { [fromId]: 0 };
  const prev = {};
  const visited = new Set();
  const queue = [[0, fromId]];
  while (queue.length) {
    queue.sort((a, b) => a[0] - b[0]);
    const [d, u] = queue.shift();
    if (visited.has(u)) continue;
    visited.add(u);
    if (u === toId) break;
    (adj[u] || []).forEach((edge) => {
      const nd = d + edge.w;
      if (distMap[edge.to] === undefined || nd < distMap[edge.to]) {
        distMap[edge.to] = nd;
        prev[edge.to] = { from: u, segmentId: edge.segmentId, reversed: edge.reversed };
        queue.push([nd, edge.to]);
      }
    });
  }
  if (distMap[toId] === undefined) return null;
  const hops = [];
  let cur = toId;
  while (cur !== fromId) {
    const p = prev[cur];
    if (!p) return null;
    hops.unshift({ segmentId: p.segmentId, reversed: p.reversed });
    cur = p.from;
  }
  return hops;
}
function pointsFromHops(data, hops) {
  if (!hops || hops.length === 0) return null;
  let pts = [];
  hops.forEach((hop, idx) => {
    const seg = data.segments.find((s) => s.id === hop.segmentId);
    if (!seg) return;
    let segPts = seg.points;
    if (hop.reversed) segPts = [...segPts].reverse();
    pts = idx === 0 ? pts.concat(segPts) : pts.concat(segPts.slice(1));
  });
  return pts;
}
function concatenatedPathPoints(data, fromId, toId) {
  const hops = shortestPath(data, fromId, toId);
  return pointsFromHops(data, hops);
}

// ---- mode-restricted, terrain-weighted travel calculation ----------------
// only considers segments matching segType (land/sea/air); "effective" miles
// factor in each segment's difficulty multiplier, "raw" miles do not.
function shortestPathTyped(data, fromId, toId, segType) {
  if (fromId === toId) return { effectiveMiles: 0, rawMiles: 0, hops: [] };
  const adj = {};
  (data.segments || []).forEach((seg) => {
    if ((seg.type || "land") !== segType) return;
    if (seg.unconventional) return;
    const mult = seg.multiplier || 1;
    const rawMiles = seg.miles != null ? seg.miles : routeLengthPx(seg.points) * (data.calibration ? data.calibration.milesPerPixel : 0.05);
    const w = rawMiles * mult;
    (adj[seg.fromNodeId] = adj[seg.fromNodeId] || []).push({ to: seg.toNodeId, w, raw: rawMiles, segmentId: seg.id, reversed: false });
    (adj[seg.toNodeId] = adj[seg.toNodeId] || []).push({ to: seg.fromNodeId, w, raw: rawMiles, segmentId: seg.id, reversed: true });
  });
  const distMap = { [fromId]: 0 };
  const rawMap = { [fromId]: 0 };
  const prev = {};
  const visited = new Set();
  const queue = [[0, fromId]];
  while (queue.length) {
    queue.sort((a, b) => a[0] - b[0]);
    const [d, u] = queue.shift();
    if (visited.has(u)) continue;
    visited.add(u);
    if (u === toId) break;
    (adj[u] || []).forEach((edge) => {
      const nd = d + edge.w;
      if (distMap[edge.to] === undefined || nd < distMap[edge.to]) {
        distMap[edge.to] = nd;
        rawMap[edge.to] = (rawMap[u] || 0) + edge.raw;
        prev[edge.to] = { from: u, segmentId: edge.segmentId, reversed: edge.reversed };
        queue.push([nd, edge.to]);
      }
    });
  }
  if (distMap[toId] === undefined) return null;
  const hops = [];
  let cur = toId;
  while (cur !== fromId) {
    const p = prev[cur];
    if (!p) return null;
    hops.unshift({ segmentId: p.segmentId, reversed: p.reversed });
    cur = p.from;
  }
  return { effectiveMiles: distMap[toId], rawMiles: rawMap[toId], hops };
}

// ---- fastest route, mixing modes across land/sea segments as needed ------
// each segment is assigned to whichever registered mode of its type is
// fastest (e.g. horseback beats walking on land). Established air segments
// are included too — this is how a trip can hop from horseback/ship onto
// an airship at a city with a known air route — but there's no straight-
// line flight fallback here; only routes you've actually drawn count.
function fastestMixedPath(data, fromId, toId) {
  if (fromId === toId) return { legs: [], hops: [], totalDays: 0 };
  const adj = {};
  (data.segments || []).forEach((seg) => {
    const type = seg.type || "land";
    if (seg.unconventional) return;
    const modesOfType = data.travelModes.filter((m) => m.segType === type);
    if (modesOfType.length === 0) return;
    const bestMode = modesOfType.reduce((a, b) => (b.speed > a.speed ? b : a));
    const mult = seg.multiplier || 1;
    const rawMiles = seg.miles != null ? seg.miles : routeLengthPx(seg.points) * (data.calibration ? data.calibration.milesPerPixel : 0.05);
    const time = (rawMiles * mult) / bestMode.speed;
    const base = { w: time, raw: rawMiles, modeId: bestMode.id, modeName: bestMode.name, segmentId: seg.id };
    (adj[seg.fromNodeId] = adj[seg.fromNodeId] || []).push({ ...base, to: seg.toNodeId, reversed: false });
    (adj[seg.toNodeId] = adj[seg.toNodeId] || []).push({ ...base, to: seg.fromNodeId, reversed: true });
  });
  const distMap = { [fromId]: 0 };
  const prev = {};
  const visited = new Set();
  const queue = [[0, fromId]];
  while (queue.length) {
    queue.sort((a, b) => a[0] - b[0]);
    const [d, u] = queue.shift();
    if (visited.has(u)) continue;
    visited.add(u);
    if (u === toId) break;
    (adj[u] || []).forEach((edge) => {
      const nd = d + edge.w;
      if (distMap[edge.to] === undefined || nd < distMap[edge.to]) {
        distMap[edge.to] = nd;
        prev[edge.to] = { from: u, ...edge };
        queue.push([nd, edge.to]);
      }
    });
  }
  if (distMap[toId] === undefined) return null;
  const legs = [];
  let cur = toId;
  while (cur !== fromId) {
    const p = prev[cur];
    if (!p) return null;
    legs.unshift({ modeId: p.modeId, modeName: p.modeName, miles: p.raw, segmentId: p.segmentId, reversed: p.reversed, from: p.from, to: cur });
    cur = p.from;
  }
  const groups = [];
  legs.forEach((leg) => {
    const last = groups[groups.length - 1];
    if (last && last.modeId === leg.modeId) { last.to = leg.to; last.miles += leg.miles; }
    else groups.push({ modeId: leg.modeId, modeName: leg.modeName, from: leg.from, to: leg.to, miles: leg.miles });
  });
  const hops = legs.map((l) => ({ segmentId: l.segmentId, reversed: l.reversed }));
  return { legs: groups, hops, totalDays: Math.max(0.25, roundToQuarterDay(distMap[toId])) };
}

// rounds to the nearest quarter-day (e.g. 1.38 -> 1.5), at most 2 decimal places, no trailing zeros
function roundToQuarterDay(days) {
  const rounded = Math.round(days * 4) / 4;
  return Math.round(rounded * 100) / 100;
}

function calculateTravel(data, fromId, toId, modeId) {
  if (!fromId || !toId) return null;
  if (fromId === toId) return { days: 0, miles: 0, note: "same location" };

  if (modeId === "fastest") {
    const result = fastestMixedPath(data, fromId, toId);
    if (!result) return { note: "no connected route (land, sea, or established air) between these two locations" };
    return {
      days: result.totalDays,
      legs: result.legs.map((l) => ({ ...l, fromName: nodeById(data, l.from)?.name || "junction", toName: nodeById(data, l.to)?.name || "junction" })),
      highlightPoints: pointsFromHops(data, result.hops),
    };
  }

  const mode = data.travelModes.find((m) => m.id === modeId);
  if (!mode) return null;

  if (mode.segType === "air") {
    const airPath = shortestPathTyped(data, fromId, toId, "air");
    if (airPath) {
      return { miles: airPath.rawMiles, days: Math.max(0.25, roundToQuarterDay(airPath.effectiveMiles / mode.speed)), note: "flying a drawn air route", highlightPoints: pointsFromHops(data, airPath.hops) };
    }
    const a = data.locations.find((l) => l.id === fromId), b = data.locations.find((l) => l.id === toId);
    if (!a || !b) return null;
    if (!data.calibration) return { note: "set the map scale first (Calibrate scale)" };
    const miles = dist(a, b) * data.calibration.milesPerPixel;
    return { miles, days: Math.max(0.25, roundToQuarterDay(miles / mode.speed)), note: "straight line — flying over the terrain, no air route drawn", highlightPoints: [a, b] };
  }

  const path = shortestPathTyped(data, fromId, toId, mode.segType);
  if (!path) return { note: `no ${mode.segType} route connects these two locations` };
  return { miles: path.rawMiles, days: Math.max(0.25, roundToQuarterDay(path.effectiveMiles / mode.speed)), highlightPoints: pointsFromHops(data, path.hops) };
}

// ---- shared timeline logic -------------------------------------------------
function pointsForChar(data, charId) {
  return data.points.filter((p) => p.characterId === charId).sort((a, b) => a.startDay - b.startDay);
}

function mapPositionForChar(data, charId, day) {
  const pts = pointsForChar(data, charId);
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    if (day >= p.startDay && day <= p.endDay) {
      const loc = data.locations.find((l) => l.id === p.locationId);
      return loc ? { x: loc.x, y: loc.y, label: loc.name, note: p.note } : null;
    }
    const next = pts[i + 1];
    if (next && day > p.endDay && day < next.startDay && p.locationId !== next.locationId) {
      const fromLoc = data.locations.find((l) => l.id === p.locationId);
      const toLoc = data.locations.find((l) => l.id === next.locationId);
      if (!fromLoc || !toLoc) return null;
      const t = (day - p.endDay) / (next.startDay - p.endDay);
      const pathPts = concatenatedPathPoints(data, p.locationId, next.locationId);
      if (pathPts) {
        const pt = pointAtFraction(pathPts, t);
        return { x: pt.x, y: pt.y, label: "en route", note: "" };
      }
      return { x: fromLoc.x + (toLoc.x - fromLoc.x) * t, y: fromLoc.y + (toLoc.y - fromLoc.y) * t, label: "en route", note: "" };
    }
  }
  return null;
}

// which locationId (if any) a character is stationed at on a given day (null if traveling/absent)
function stationedLocation(data, charId, day) {
  const pts = pointsForChar(data, charId);
  const hit = pts.find((p) => day >= p.startDay && day <= p.endDay);
  return hit ? hit.locationId : null;
}

function SetupScreen({ onOpen }) {
  const [val, setVal] = useState("");
  return (
    <div className="min-h-screen bg-[#15151a] text-[#ece7dd] flex items-center justify-center px-6">
      <div className="max-w-sm w-full">
        <h1 className="text-2xl mb-2" style={{ fontFamily: "Georgia, serif" }}>Ieldohr Story Map</h1>
        <p className="text-sm text-[#8f8a7f] font-mono mb-6">Enter a map name. Use the same one on every device to sync.</p>
        <input value={val} onChange={(e) => setVal(e.target.value)} placeholder="e.g. ieldohr-main"
          className="w-full bg-[#1c1c22] border border-[#3a3a44] rounded px-3 py-2 text-sm mb-3"
          onKeyDown={(e) => e.key === "Enter" && val.trim() && onOpen(val.trim())} />
        <button onClick={() => val.trim() && onOpen(val.trim())}
          className="w-full px-3 py-2 text-sm border border-[#3a3a44] rounded hover:border-[#8f8a7f] transition">Open map</button>
      </div>
    </div>
  );
}

function App() {
  const [mapId, setMapId] = useState(() => localStorage.getItem("storyWorldId") || null);
  const [data, setData] = useState(emptyData);
  const [loaded, setLoaded] = useState(false);
  const [status, setStatus] = useState("idle");
  const [configError, setConfigError] = useState(false);
  const saveTimer = useRef(null);
  const firstLoad = useRef(true);

  const [mode, setMode] = useState("view"); // view | calibrate | pin | route | point
  const [calibPoints, setCalibPoints] = useState([]);
  const [routeDraft, setRouteDraft] = useState([]);
  const [selectedChar, setSelectedChar] = useState(null);
  const [editingPointId, setEditingPointId] = useState(null);
  const [day, setDay] = useState(1);
  const [playing, setPlaying] = useState(false);
  const [showLabels, setShowLabels] = useState(true);
  const [highlightPath, setHighlightPath] = useState(null);
  const [selectedNodeId, setSelectedNodeId] = useState(null);

  const [zoom, setZoom] = useState(1);
  const [pan, setPan] = useState({ x: 0, y: 0 });
  const dragRef = useRef({ active: false, startX: 0, startY: 0, startPan: { x: 0, y: 0 }, moved: false });

  const imgRef = useRef(null);
  const viewportRef = useRef(null);

  function clampZoom(z) { return Math.min(5, Math.max(1, z)); }

  function onWheelZoom(e) {
    e.preventDefault();
    setZoom((z) => clampZoom(z - e.deltaY * 0.0015));
  }
  function onMapMouseDown(e) {
    dragRef.current = { active: true, startX: e.clientX, startY: e.clientY, startPan: { ...pan }, moved: false };
  }
  function onMapMouseMove(e) {
    if (!dragRef.current.active) return;
    const dx = e.clientX - dragRef.current.startX;
    const dy = e.clientY - dragRef.current.startY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragRef.current.moved = true;
    if (dragRef.current.moved) {
      setPan({ x: dragRef.current.startPan.x + dx, y: dragRef.current.startPan.y + dy });
    }
  }
  function onMapMouseUp() { dragRef.current.active = false; }
  function resetView() { setZoom(1); setPan({ x: 0, y: 0 }); }

  useEffect(() => {
    if (SUPABASE_URL.includes("YOUR_SUPABASE") || SUPABASE_ANON_KEY.includes("YOUR_SUPABASE")) setConfigError(true);
  }, []);

  useEffect(() => {
    if (!mapId) return;
    (async () => {
      const { data: row } = await supabase.from(TABLE).select("*").eq("id", mapId).single();
      if (row) setData(migrateData(row.data));
      else { await supabase.from(TABLE).insert({ id: mapId, data: emptyData }); setData(emptyData); }
      firstLoad.current = true;
      setLoaded(true);
    })();
  }, [mapId]);

  useEffect(() => {
    if (!loaded || !mapId) return;
    if (firstLoad.current) { firstLoad.current = false; return; }
    setStatus("saving");
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      const { error } = await supabase.from(TABLE).update({ data, updated_at: new Date().toISOString() }).eq("id", mapId);
      setStatus(error ? "error" : "saved");
    }, 700);
  }, [data]);

  useEffect(() => {
    if (!playing) return;
    const t = setInterval(() => setDay((d) => d + 1), 500);
    return () => clearInterval(t);
  }, [playing]);

  useEffect(() => {
    const el = threadScrollRef.current;
    if (!el) return;
    const update = () => setThreadScrollMax(Math.max(0, el.scrollWidth - el.clientWidth));
    update();
    window.addEventListener("resize", update);
    return () => window.removeEventListener("resize", update);
  }, [dayWidth, data.points, data.characters.length]);

  function openMap(id) { localStorage.setItem("storyWorldId", id); setMapId(id); }
  function switchMap() { localStorage.removeItem("storyWorldId"); setMapId(null); setLoaded(false); setData(emptyData); }
  function update(patch) { setData((d) => ({ ...d, ...patch })); }

  function handleMapClick(e) {
    if (dragRef.current.moved) { dragRef.current.moved = false; return; }
    const rect = imgRef.current.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;

    if (mode === "calibrate") {
      const pts = [...calibPoints, { x, y }];
      if (pts.length === 2) {
        const miles = prompt("Real-world distance between these two points, in miles:");
        if (miles && !isNaN(parseFloat(miles))) {
          const px = dist(pts[0], pts[1]);
          update({ calibration: { milesPerPixel: parseFloat(miles) / px } });
        }
        setCalibPoints([]); setMode("view");
      } else setCalibPoints(pts);
    } else if (mode === "pin") {
      const name = prompt("Location name:");
      if (name && name.trim()) update({ locations: [...data.locations, { id: uid(), name: name.trim(), x, y }] });
      setMode("view");
    } else if (mode === "route") {
      setRouteDraft((pts) => [...pts, { x, y }]);
    } else if (mode === "point") {
      if (!selectedChar) { alert("Select a character in the sidebar first."); return; }
      const threshold = 2; // % distance tolerance to snap to existing pin
      let loc = data.locations.find((l) => Math.hypot(l.x - x, l.y - y) < threshold);
      if (!loc) {
        let segBest = null, segBestD = Infinity;
        data.segments.forEach((seg) => {
          const np = nearestPointOnPolyline({ x, y }, seg.points);
          if (np.d < threshold && np.d < segBestD) { segBestD = np.d; segBest = { seg, np }; }
        });
        const name = prompt(segBest ? `New location name (this splices into "${segBest.seg.name}"):` : "New location name (you clicked an unpinned spot):");
        if (!name || !name.trim()) return;

        if (segBest) {
          const { seg, np } = segBest;
          loc = { id: uid(), name: name.trim(), x: np.point.x, y: np.point.y };
          const before = seg.points.slice(0, np.segIndex + 1).concat([np.point]);
          const after = [np.point].concat(seg.points.slice(np.segIndex + 1));
          const milesA = data.calibration ? routeLengthPx(before) * data.calibration.milesPerPixel : null;
          const milesB = data.calibration ? routeLengthPx(after) * data.calibration.milesPerPixel : null;
          const newSegments = data.segments.filter((s) => s.id !== seg.id).concat([
            { id: uid(), name: seg.name, fromNodeId: seg.fromNodeId, toNodeId: loc.id, points: before, miles: milesA, type: seg.type, multiplier: seg.multiplier },
            { id: uid(), name: seg.name, fromNodeId: loc.id, toNodeId: seg.toNodeId, points: after, miles: milesB, type: seg.type, multiplier: seg.multiplier },
          ]);
          update({ locations: [...data.locations, loc], segments: newSegments });
        } else {
          loc = { id: uid(), name: name.trim(), x, y };
          update({ locations: [...data.locations, loc] });
        }
      }
      const newPoint = { id: uid(), characterId: selectedChar, locationId: loc.id, startDay: day, endDay: day, note: "" };
      setData((d) => ({ ...d, points: [...d.points, newPoint] }));
      setEditingPointId(newPoint.id);
    }
  }

  const SNAP_THRESHOLD = 2; // % of image size

  function finishRoute() {
    if (routeDraft.length < 2) { setRouteDraft([]); setMode("view"); return; }

    let junctions = data.junctions || [];
    let segments = data.segments || [];

    function resolveEndpoint(pt) {
      let best = null, bestD = Infinity;
      data.locations.forEach((l) => { const d = Math.hypot(l.x - pt.x, l.y - pt.y); if (d < SNAP_THRESHOLD && d < bestD) { bestD = d; best = l.id; } });
      if (best) return { nodeId: best, name: data.locations.find((l) => l.id === best).name };
      junctions.forEach((j) => { const d = Math.hypot(j.x - pt.x, j.y - pt.y); if (d < SNAP_THRESHOLD && d < bestD) { bestD = d; best = j.id; } });
      if (best) return { nodeId: best, name: "junction" };

      // try snapping onto an existing segment's path — this is what creates a fork
      let segBest = null, segBestD = Infinity;
      segments.forEach((seg) => {
        const np = nearestPointOnPolyline(pt, seg.points);
        if (np.d < SNAP_THRESHOLD && np.d < segBestD) { segBestD = np.d; segBest = { seg, np }; }
      });
      if (segBest) {
        const { seg, np } = segBest;
        const newJ = { id: uid(), x: np.point.x, y: np.point.y };
        junctions = [...junctions, newJ];
        const before = seg.points.slice(0, np.segIndex + 1).concat([np.point]);
        const after = [np.point].concat(seg.points.slice(np.segIndex + 1));
        const milesA = data.calibration ? routeLengthPx(before) * data.calibration.milesPerPixel : null;
        const milesB = data.calibration ? routeLengthPx(after) * data.calibration.milesPerPixel : null;
        segments = segments.filter((s) => s.id !== seg.id).concat([
          { id: uid(), name: seg.name, fromNodeId: seg.fromNodeId, toNodeId: newJ.id, points: before, miles: milesA, type: seg.type, multiplier: seg.multiplier },
          { id: uid(), name: seg.name, fromNodeId: newJ.id, toNodeId: seg.toNodeId, points: after, miles: milesB, type: seg.type, multiplier: seg.multiplier },
        ]);
        return { nodeId: newJ.id, name: "fork of " + seg.name };
      }

      // nothing nearby — drop a brand new (unnamed) junction right here
      const newJ = { id: uid(), x: pt.x, y: pt.y };
      junctions = [...junctions, newJ];
      return { nodeId: newJ.id, name: "junction" };
    }

    const from = resolveEndpoint(routeDraft[0]);
    const to = resolveEndpoint(routeDraft[routeDraft.length - 1]);
    if (from.nodeId === to.nodeId) { alert("Start and end of this path landed on the same point — draw between two distinct points."); setRouteDraft([]); setMode("view"); return; }

    const name = prompt(`Path name (connecting ${from.name} — ${to.name}):`, `${from.name} – ${to.name}`);
    if (name === null) { setRouteDraft([]); setMode("view"); return; }
    let type = (prompt(`Terrain type — type "land", "sea", or "air":`, "land") || "land").trim().toLowerCase();
    if (!["land", "sea", "air"].includes(type)) type = "land";
    const multRaw = prompt(`Difficulty multiplier (1 = normal pace, 2 = twice as slow, e.g. rough desert terrain):`, "1");
    const multiplier = Math.max(0.1, parseFloat(multRaw) || 1);
    const miles = data.calibration ? routeLengthPx(routeDraft) * data.calibration.milesPerPixel : null;
    segments = [...segments, { id: uid(), name: name || `${from.name} – ${to.name}`, fromNodeId: from.nodeId, toNodeId: to.nodeId, points: routeDraft, miles, type, multiplier }];

    update({ junctions, segments });
    setRouteDraft([]); setMode("view");
  }

  function updateSegment(id, patch) {
    update({ segments: data.segments.map((s) => (s.id === id ? { ...s, ...patch } : s)) });
  }

  function removeSegment(id) {
    const remaining = data.segments.filter((s) => s.id !== id);
    const used = new Set();
    remaining.forEach((s) => { used.add(s.fromNodeId); used.add(s.toNodeId); });
    const remainingJunctions = (data.junctions || []).filter((j) => used.has(j.id));
    update({ segments: remaining, junctions: remainingJunctions });
  }

  function removeLocation(id) {
    const loc = data.locations.find((l) => l.id === id);
    const connectedPoints = data.points.filter((p) => p.locationId === id).length;
    const connectedSegments = data.segments.filter((s) => s.fromNodeId === id || s.toNodeId === id).length;
    const warning = connectedPoints || connectedSegments
      ? ` This will also remove ${connectedSegments} connected path(s) and ${connectedPoints} character point(s) at this location.`
      : "";
    if (!confirm(`Delete "${loc?.name}"?${warning}`)) return;
    const remainingSegments = data.segments.filter((s) => s.fromNodeId !== id && s.toNodeId !== id);
    const used = new Set();
    remainingSegments.forEach((s) => { used.add(s.fromNodeId); used.add(s.toNodeId); });
    const remainingJunctions = (data.junctions || []).filter((j) => used.has(j.id));
    update({
      locations: data.locations.filter((l) => l.id !== id),
      segments: remainingSegments,
      junctions: remainingJunctions,
      points: data.points.filter((p) => p.locationId !== id),
    });
  }

  function addCharacter(name) {
    if (!name.trim()) return;
    const color = PALETTE[data.characters.length % PALETTE.length];
    update({ characters: [...data.characters, { id: uid(), name: name.trim(), color }] });
  }
  function removeCharacter(id) {
    update({ characters: data.characters.filter((c) => c.id !== id), points: data.points.filter((p) => p.characterId !== id) });
    if (selectedChar === id) setSelectedChar(null);
  }

  function addPointForm(charId, locationId, startDay, endDay, note) {
    update({ points: [...data.points, { id: uid(), characterId: charId, locationId, startDay, endDay, note }] });
  }
  function updatePoint(pointId, patch) {
    update({ points: data.points.map((p) => (p.id === pointId ? { ...p, ...patch } : p)) });
  }
  function removePoint(pointId) {
    update({ points: data.points.filter((p) => p.id !== pointId) });
    if (editingPointId === pointId) setEditingPointId(null);
  }

  const pointsMaxDay = useMemo(() => data.points.reduce((m, p) => Math.max(m, p.endDay), 1), [data.points]);
  const maxDay = Math.max(pointsMaxDay, data.timelineDays || 1);

  const UNIT_DAYS = { days: 1, weeks: 7, months: 30 };
  function formatDay(d) {
    if (data.timelineUnit === "weeks") return `Week ${(d / 7).toFixed(1)} (day ${d})`;
    if (data.timelineUnit === "months") return `Month ${(d / 30).toFixed(1)} (day ${d})`;
    return `Day ${d}`;
  }

  // ---- thread diagram computation ----
  const [dayWidth, setDayWidth] = useState(26);
  const threadScrollRef = useRef(null);
  const [threadScrollLeft, setThreadScrollLeft] = useState(0);
  const [threadScrollMax, setThreadScrollMax] = useState(0);
  const LANE_H = 56, LEFT_PAD = 90, TOP_PAD = 30, BOTTOM_PAD = 30;
  const threadLayout = useMemo(() => {
    if (data.characters.length === 0 || data.points.length === 0) return { paths: [], bubbles: [], width: 400, height: 200 };
    const homeLane = (charId) => data.characters.findIndex((c) => c.id === charId);

    // global breakpoints: every startDay and endDay+1 across all points
    const breakSet = new Set();
    data.points.forEach((p) => { breakSet.add(p.startDay); breakSet.add(p.endDay + 1); });
    const breaks = Array.from(breakSet).sort((a, b) => a - b);

    function laneYFor(charId, dayVal) {
      const loc = stationedLocation(data, charId, dayVal);
      if (loc == null) return null;
      const group = data.characters.filter((c) => stationedLocation(data, c.id, dayVal) === loc);
      const avgLane = group.reduce((s, c) => s + homeLane(c.id), 0) / group.length;
      return { y: TOP_PAD + avgLane * LANE_H, group, loc };
    }

    const paths = data.characters.map((ch) => {
      const pts = pointsForChar(data, ch.id);
      if (pts.length === 0) return { ch, pts: [] };
      const minD = pts[0].startDay, maxD = pts[pts.length - 1].endDay;
      const cols = breaks.filter((b) => b >= minD && b <= maxD);
      const verts = cols.map((d) => {
        const info = laneYFor(ch.id, d);
        const y = info ? info.y : TOP_PAD + homeLane(ch.id) * LANE_H;
        return { x: LEFT_PAD + (d - breaks[0]) * dayWidth, y, day: d };
      });
      return { ch, pts: verts };
    });

    const bubbleMap = new Map();
    breaks.forEach((d) => {
      const present = data.characters.filter((c) => stationedLocation(data, c.id, d) != null);
      const byLoc = {};
      present.forEach((c) => {
        const loc = stationedLocation(data, c.id, d);
        (byLoc[loc] = byLoc[loc] || []).push(c);
      });
      Object.entries(byLoc).forEach(([locId, chars]) => {
        if (chars.length > 1) {
          const avgLane = chars.reduce((s, c) => s + homeLane(c.id), 0) / chars.length;
          const key = `${d}-${locId}`;
          const colors = chars.map((c) => c.color);
          const locName = data.locations.find((l) => l.id === locId)?.name || "";
          bubbleMap.set(key, { x: LEFT_PAD + (d - breaks[0]) * dayWidth, y: TOP_PAD + avgLane * LANE_H, colors, locName });
        }
      });
    });

    const width = LEFT_PAD + (breaks[breaks.length - 1] - breaks[0]) * dayWidth + 60;
    const height = TOP_PAD + Math.max(data.characters.length - 1, 0) * LANE_H + BOTTOM_PAD + TOP_PAD;
    return { paths, bubbles: Array.from(bubbleMap.values()), width, height, dayToX: (d) => LEFT_PAD + (d - breaks[0]) * dayWidth };
  }, [data, dayWidth]);

  function pathD(pts) {
    if (pts.length === 0) return "";
    if (pts.length === 1) return `M ${pts[0].x} ${pts[0].y}`;
    let d = `M ${pts[0].x} ${pts[0].y}`;
    for (let i = 1; i < pts.length; i++) {
      const midX = (pts[i - 1].x + pts[i].x) / 2;
      d += ` C ${midX} ${pts[i - 1].y}, ${midX} ${pts[i].y}, ${pts[i].x} ${pts[i].y}`;
    }
    return d;
  }
  function blend(hexes) {
    const rgbs = hexes.map((h) => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]);
    const n = rgbs.length;
    return `rgb(${Math.round(rgbs.reduce((s,c)=>s+c[0],0)/n)}, ${Math.round(rgbs.reduce((s,c)=>s+c[1],0)/n)}, ${Math.round(rgbs.reduce((s,c)=>s+c[2],0)/n)})`;
  }

  if (configError) {
    return (
      <div className="min-h-screen bg-[#15151a] text-[#ece7dd] flex items-center justify-center px-6">
        <div className="max-w-md text-sm font-mono leading-relaxed">
          <p className="mb-2 text-[#e0555f]">Supabase isn't configured yet.</p>
          <p className="text-[#8f8a7f]">Fill in SUPABASE_URL and SUPABASE_ANON_KEY near the top of the script.</p>
        </div>
      </div>
    );
  }
  if (!mapId) return <SetupScreen onOpen={openMap} />;
  if (!loaded) return <div className="min-h-screen bg-[#15151a] text-[#8f8a7f] flex items-center justify-center font-mono text-sm">Loading map…</div>;

  const currentPositions = data.characters.map((c) => ({ c, pos: mapPositionForChar(data, c.id, day) }));
  const editingPoint = data.points.find((p) => p.id === editingPointId);

  return (
    <div className="min-h-screen bg-[#15151a] text-[#ece7dd] font-serif">
      <div className="max-w-[1600px] mx-auto px-6 py-8">
        <div className="flex items-end justify-between mb-6 border-b border-[#3a3a44] pb-4">
          <div>
            <h1 className="text-3xl tracking-tight" style={{ fontFamily: "Georgia, serif" }}>Ieldohr Story Map</h1>
            <p className="text-sm text-[#8f8a7f] mt-1 font-mono">map: {mapId} · {status === "saving" ? "saving…" : status === "saved" ? "synced" : status === "error" ? "save failed" : ""}</p>
          </div>
          <button onClick={switchMap} className="px-3 py-1.5 text-xs font-mono border border-[#3a3a44] rounded hover:border-[#8f8a7f] transition">Switch map</button>
        </div>

        <div className="grid lg:grid-cols-[1fr_360px] gap-6">
          <div className="min-w-0">
            <div className="flex flex-wrap gap-2 mb-3 font-mono text-xs">
              {["view", "calibrate", "pin", "route", "point"].map((m) => (
                <button key={m} onClick={() => { setMode(m); setCalibPoints([]); setRouteDraft([]); }}
                  className="px-3 py-1.5 rounded border transition"
                  style={{ borderColor: mode === m ? "#ece7dd" : "#3a3a44", background: mode === m ? "#ece7dd22" : "transparent" }}>
                  {m === "view" ? "View" : m === "calibrate" ? "Calibrate scale" : m === "pin" ? "Add pin" : m === "route" ? "Draw route" : "Add point (click map)"}
                </button>
              ))}
              {mode === "route" && <button onClick={finishRoute} className="px-3 py-1.5 rounded border border-[#4fb8a0] text-[#4fb8a0]">Finish route ({routeDraft.length} pts)</button>}
              {mode === "point" && <span className="px-3 py-1.5 text-[#8f8a7f]">active: {data.characters.find(c=>c.id===selectedChar)?.name || "select a character →"} · day {day}</span>}
              {data.calibration && <span className="px-3 py-1.5 text-[#8f8a7f]">1px ≈ {data.calibration.milesPerPixel.toFixed(3)} mi</span>}
              <span className="flex items-center gap-1 ml-auto">
                <button onClick={() => setZoom((z) => clampZoom(z - 0.4))} className="px-2 py-1 border border-[#3a3a44] rounded hover:border-[#8f8a7f]">−</button>
                <span className="px-1 text-[#8f8a7f]">{Math.round(zoom * 100)}%</span>
                <button onClick={() => setZoom((z) => clampZoom(z + 0.4))} className="px-2 py-1 border border-[#3a3a44] rounded hover:border-[#8f8a7f]">+</button>
                <button onClick={resetView} className="px-2 py-1 border border-[#3a3a44] rounded hover:border-[#8f8a7f]">Reset view</button>
                <button onClick={() => setShowLabels((s) => !s)} className="px-2 py-1 border border-[#3a3a44] rounded hover:border-[#8f8a7f]">{showLabels ? "Hide" : "Show"} names</button>
              </span>
            </div>

            <div
              ref={viewportRef}
              className="relative border border-[#3a3a44] rounded bg-[#0f0f13]"
              style={{ overflow: "hidden", aspectRatio: `${MAP_NATURAL_W} / ${MAP_NATURAL_H}`, maxHeight: "75vh", cursor: mode === "view" ? (dragRef.current.active ? "grabbing" : "grab") : "crosshair" }}
              onWheel={onWheelZoom}
              onMouseDown={onMapMouseDown}
              onMouseMove={onMapMouseMove}
              onMouseUp={onMapMouseUp}
              onMouseLeave={onMapMouseUp}
            >
              <div style={{ transform: `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`, transformOrigin: "0 0", width: "100%", position: "relative" }}>
                <img ref={imgRef} src={MAP_IMAGE} alt="map" className="w-full block select-none" draggable={false} onClick={handleMapClick} />
                <svg className="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 100 100" preserveAspectRatio="none">
                  {data.segments.map((r) => {
                    const type = r.type || "land";
                    const color = type === "sea" ? "#7ec8e3" : type === "air" ? "#2b3f8c" : "#ece7dd";
                    const dash = r.unconventional ? "0.5 1.4" : "1.6 0.8";
                    const width = r.unconventional ? "0.5" : "0.7";
                    const opacity = r.unconventional ? "0.55" : "0.9";
                    return (
                      <polyline key={r.id} points={r.points.map((p) => `${p.x},${p.y}`).join(" ")} fill="none" stroke={color} strokeWidth={width} strokeDasharray={dash} opacity={opacity} vectorEffect="non-scaling-stroke" />
                    );
                  })}
                  {routeDraft.length > 0 && <polyline points={routeDraft.map((p) => `${p.x},${p.y}`).join(" ")} fill="none" stroke="#4fb8a0" strokeWidth="0.7" vectorEffect="non-scaling-stroke" />}
                  {(data.junctions || []).map((j) => <circle key={j.id} cx={j.x} cy={j.y} r="0.35" fill="#e8a33d" stroke="#15151a" strokeWidth="0.1" />)}
                  {data.locations.map((l) => <circle key={l.id} cx={l.x} cy={l.y} r="0.6" fill="#ece7dd" stroke="#15151a" strokeWidth="0.15" />)}
                  {currentPositions.map(({ c, pos }) => pos && <circle key={c.id} cx={pos.x} cy={pos.y} r="1" fill={c.color} stroke="#15151a" strokeWidth="0.2" />)}
                  {highlightPath && highlightPath.length > 1 && (
                    <polyline points={highlightPath.map((p) => `${p.x},${p.y}`).join(" ")} fill="none" stroke="#f5d547" strokeWidth="1" strokeLinecap="round" vectorEffect="non-scaling-stroke" />
                  )}
                  {selectedNodeId && (() => {
                    const n = nodeById(data, selectedNodeId);
                    if (!n) return null;
                    return (
                      <g>
                        <circle cx={n.x} cy={n.y} r="2.4" fill="none" stroke="#15151a" strokeWidth="1.1" opacity="0.7" vectorEffect="non-scaling-stroke" />
                        <circle cx={n.x} cy={n.y} r="2.2" fill="none" stroke="#f5d547" strokeWidth="0.7" vectorEffect="non-scaling-stroke">
                          <animate attributeName="r" values="2;2.6;2" dur="1.4s" repeatCount="indefinite" />
                          <animate attributeName="opacity" values="1;0.5;1" dur="1.4s" repeatCount="indefinite" />
                        </circle>
                        <circle cx={n.x} cy={n.y} r="0.9" fill="none" stroke="#f5d547" strokeWidth="0.4" vectorEffect="non-scaling-stroke" />
                      </g>
                    );
                  })()}
                </svg>
                {showLabels && data.locations.map((l) => (
                  <div key={l.id} className="absolute text-[10px] font-mono text-[#ece7dd] bg-[#15151a]/70 px-1 rounded pointer-events-none"
                    style={{ left: `${l.x}%`, top: `${l.y}%`, transform: "translate(6px, -50%)" }}>{l.name}</div>
                ))}
              </div>
            </div>
            <p className="text-xs text-[#8f8a7f] font-mono mt-1">scroll/pinch to zoom · click-drag to pan (in View mode)</p>

            {editingPoint && (
              <div className="mt-3 border border-[#4fb8a0] rounded p-3 text-xs space-y-2">
                <div className="flex items-center justify-between">
                  <span className="font-mono text-[#8f8a7f]">Editing point at {data.locations.find(l=>l.id===editingPoint.locationId)?.name}</span>
                  <button onClick={() => setEditingPointId(null)} className="text-[#8f8a7f] hover:text-[#ece7dd]">done ✕</button>
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-[#8f8a7f]">days</span>
                  <input type="number" value={editingPoint.startDay} onChange={(e) => updatePoint(editingPoint.id, { startDay: parseInt(e.target.value) || 1 })} className="w-16 bg-[#1c1c22] border border-[#3a3a44] rounded px-2 py-1" />
                  <span>–</span>
                  <input type="number" value={editingPoint.endDay} onChange={(e) => updatePoint(editingPoint.id, { endDay: parseInt(e.target.value) || 1 })} className="w-16 bg-[#1c1c22] border border-[#3a3a44] rounded px-2 py-1" />
                </div>
                <textarea value={editingPoint.note} onChange={(e) => updatePoint(editingPoint.id, { note: e.target.value })} placeholder="What's happening here…" className="w-full bg-[#1c1c22] border border-[#3a3a44] rounded px-2 py-1.5 h-16" />
              </div>
            )}

            <div className="mt-4 border border-[#3a3a44] rounded p-4">
              <div className="flex flex-wrap items-center gap-3 mb-3 font-mono text-xs text-[#8f8a7f]">
                <span className="flex items-center gap-1">
                  {["days", "weeks", "months"].map((u) => (
                    <button key={u} onClick={() => update({ timelineUnit: u })}
                      className="px-2 py-1 rounded border capitalize"
                      style={{ borderColor: data.timelineUnit === u ? "#ece7dd" : "#3a3a44", color: data.timelineUnit === u ? "#ece7dd" : "#8f8a7f" }}>
                      {u}
                    </button>
                  ))}
                </span>
                <span className="flex items-center gap-1">
                  timeline length
                  <input type="number" min="1" value={Math.round(data.timelineDays / UNIT_DAYS[data.timelineUnit])}
                    onChange={(e) => update({ timelineDays: Math.max(1, parseInt(e.target.value) || 1) * UNIT_DAYS[data.timelineUnit] })}
                    className="w-16 bg-[#1c1c22] border border-[#3a3a44] rounded px-2 py-1" />
                  {data.timelineUnit}
                </span>
                <span className="flex items-center gap-1">
                  go to day
                  <input type="number" min="1" value={day}
                    onChange={(e) => setDay(Math.max(1, parseInt(e.target.value) || 1))}
                    className="w-16 bg-[#1c1c22] border border-[#3a3a44] rounded px-2 py-1" />
                </span>
              </div>
              <div className="flex items-center gap-2 mb-2 font-mono text-xs flex-wrap">
                <button onClick={() => setDay((d) => Math.max(1, d - 10))} className="px-2 py-1 border border-[#3a3a44] rounded hover:border-[#8f8a7f]">« 10</button>
                <button onClick={() => setDay((d) => Math.max(1, d - 1))} className="px-2 py-1 border border-[#3a3a44] rounded hover:border-[#8f8a7f]">‹ 1</button>
                <span className="whitespace-nowrap px-1">{formatDay(day)}</span>
                <input type="range" min="1" max={maxDay} value={day} onChange={(e) => setDay(parseInt(e.target.value))} className="flex-1 min-w-[120px]" />
                <button onClick={() => setDay((d) => Math.min(maxDay, d + 1))} className="px-2 py-1 border border-[#3a3a44] rounded hover:border-[#8f8a7f]">1 ›</button>
                <button onClick={() => setDay((d) => Math.min(maxDay, d + 10))} className="px-2 py-1 border border-[#3a3a44] rounded hover:border-[#8f8a7f]">10 »</button>
                <button onClick={() => setPlaying((p) => !p)} className="px-2 py-1 border border-[#3a3a44] rounded">{playing ? "Pause" : "Play"}</button>
              </div>
              <div className="flex flex-wrap gap-3 text-xs">
                {currentPositions.map(({ c, pos }) => (
                  <div key={c.id} className="flex items-center gap-1.5">
                    <span className="w-2.5 h-2.5 rounded-full inline-block" style={{ background: c.color }} />
                    {c.name}: <span className="text-[#8f8a7f]">{pos ? pos.label : "—"}</span>
                    {pos?.note && <span className="text-[#8f8a7f] italic">— {pos.note}</span>}
                  </div>
                ))}
              </div>
            </div>

            {/* Thread diagram */}
            <div className="mt-6">
              <div className="flex items-center justify-between mb-2">
                <h2 className="text-base">Character threads</h2>
                <span className="flex items-center gap-1 font-mono text-xs text-[#8f8a7f]">
                  <button onClick={() => setDayWidth((w) => Math.max(4, w - 6))} className="px-2 py-1 border border-[#3a3a44] rounded hover:border-[#8f8a7f]">−</button>
                  <span>scale</span>
                  <button onClick={() => setDayWidth((w) => Math.min(120, w + 6))} className="px-2 py-1 border border-[#3a3a44] rounded hover:border-[#8f8a7f]">+</button>
                </span>
              </div>
              <div
                ref={threadScrollRef}
                onScroll={(e) => setThreadScrollLeft(e.currentTarget.scrollLeft)}
                className="border border-[#3a3a44] rounded bg-[#191920] overflow-x-auto"
              >
                <svg width={Math.max(threadLayout.width, 400)} height={threadLayout.height} className="block">
                  {threadLayout.dayToX && (
                    <line x1={threadLayout.dayToX(day)} y1={0} x2={threadLayout.dayToX(day)} y2={threadLayout.height} stroke="#e8a33d" strokeWidth="1" opacity="0.5" />
                  )}
                  {threadLayout.paths.map(({ ch, pts }) => (
                    <path key={ch.id} d={pathD(pts)} fill="none" stroke={ch.color} strokeWidth="3" strokeLinecap="round" opacity="0.9" />
                  ))}
                  {threadLayout.bubbles.map((b, i) => (
                    <g key={i}>
                      <circle cx={b.x} cy={b.y} r={9 + b.colors.length * 1.5} fill={blend(b.colors)} opacity="0.85" />
                    </g>
                  ))}
                  {data.characters.map((c, i) => (
                    <text key={c.id} x={10} y={30 + i * LANE_H} fontSize="11" fill={c.color} fontFamily="monospace">{c.name}</text>
                  ))}
                </svg>
              </div>
              {threadScrollMax > 0 && (
                <input
                  type="range" min="0" max={threadScrollMax} value={threadScrollLeft}
                  onChange={(e) => {
                    const v = parseInt(e.target.value);
                    setThreadScrollLeft(v);
                    if (threadScrollRef.current) threadScrollRef.current.scrollLeft = v;
                  }}
                  className="w-full mt-1.5"
                />
              )}
              <p className="text-xs text-[#8f8a7f] font-mono mt-1">amber line = current scrubber day · bubbles = characters sharing a location on overlapping days</p>
            </div>
          </div>

          {/* Sidebar */}
          <div className="space-y-6 text-sm">
            <div>
              <h2 className="text-base mb-2">Characters</h2>
              <div className="space-y-1 mb-2">
                {data.characters.map((c) => (
                  <div key={c.id} onClick={() => setSelectedChar((cur) => (cur === c.id ? null : c.id))} className="flex items-center justify-between border rounded px-2 py-1.5 cursor-pointer"
                    style={{ borderColor: selectedChar === c.id ? c.color : "#3a3a44" }}>
                    <span className="flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-full inline-block" style={{ background: c.color }} />{c.name}</span>
                    <button onClick={(e) => { e.stopPropagation(); removeCharacter(c.id); }} className="text-[#8f8a7f] hover:text-[#e0555f]">✕</button>
                  </div>
                ))}
              </div>
              <AddCharForm onAdd={addCharacter} />
            </div>

            {selectedChar && (
              <PointsEditor
                charId={selectedChar}
                points={pointsForChar(data, selectedChar)}
                locations={data.locations}
                onAdd={addPointForm}
                onUpdate={updatePoint}
                onRemove={removePoint}
                onEdit={setEditingPointId}
                onClose={() => setSelectedChar(null)}
              />
            )}

            <div>
              <h2 className="text-base mb-2">Locations ({data.locations.length})</h2>
              <div className="text-xs text-[#8f8a7f] max-h-40 overflow-y-auto space-y-0.5">
                {[...data.locations].sort((a, b) => a.name.localeCompare(b.name)).map((l) => (
                  <div key={l.id} className="flex items-center justify-between pr-1">
                    <span onClick={() => setSelectedNodeId((cur) => (cur === l.id ? null : l.id))}
                      className="cursor-pointer hover:text-[#ece7dd]" style={{ color: selectedNodeId === l.id ? "#f5d547" : undefined }}>{l.name}</span>
                    <button onClick={() => removeLocation(l.id)} className="hover:text-[#e0555f]">✕</button>
                  </div>
                ))}
              </div>
            </div>
            {(data.junctions || []).length > 0 && (
              <div>
                <h2 className="text-base mb-2">Fork points ({data.junctions.length})</h2>
                <div className="text-xs text-[#8f8a7f] max-h-32 overflow-y-auto space-y-0.5">
                  {data.junctions.map((j, i) => (
                    <div key={j.id} onClick={() => setSelectedNodeId((cur) => (cur === j.id ? null : j.id))}
                      className="cursor-pointer hover:text-[#ece7dd]" style={{ color: selectedNodeId === j.id ? "#f5d547" : undefined }}>
                      Fork {i + 1}
                    </div>
                  ))}
                </div>
              </div>
            )}
            <div>
              <div className="flex items-center justify-between mb-2">
                <h2 className="text-base">
                  Paths ({selectedNodeId ? data.segments.filter((r) => r.fromNodeId === selectedNodeId || r.toNodeId === selectedNodeId).length + " of " + data.segments.length : data.segments.length})
                </h2>
                {selectedNodeId && (
                  <button onClick={() => setSelectedNodeId(null)} className="text-xs text-[#8f8a7f] hover:text-[#ece7dd]">show all ✕</button>
                )}
              </div>
              {selectedNodeId && (
                <p className="text-[10px] text-[#e8a33d] mb-1.5">showing only paths touching the highlighted point — click it again, or "show all", to see everything</p>
              )}
              <div className="text-xs text-[#8f8a7f] max-h-56 overflow-y-auto space-y-1.5">
                {data.segments
                  .filter((r) => !selectedNodeId || r.fromNodeId === selectedNodeId || r.toNodeId === selectedNodeId)
                  .map((r) => {
                  const fromN = nodeById(data, r.fromNodeId), toN = nodeById(data, r.toNodeId);
                  const fromName = fromN ? (fromN.name || "junction") : "?";
                  const toName = toN ? (toN.name || "junction") : "?";
                  return (
                    <div key={r.id} className="border border-[#3a3a44] rounded px-2 py-1.5">
                      <div className="flex items-center gap-2 mb-1">
                        <input value={r.name} onChange={(e) => updateSegment(r.id, { name: e.target.value })}
                          className="flex-1 min-w-0 bg-[#1c1c22] border border-[#3a3a44] rounded px-1.5 py-1" />
                        <button onClick={() => removeSegment(r.id)} className="hover:text-[#e0555f] shrink-0">✕</button>
                      </div>
                      <div className="mb-1">{fromName} — {toName}{r.miles ? ` (${r.miles.toFixed(0)}mi)` : ""}</div>
                      <div className="flex items-center gap-2">
                        <select value={r.type || "land"} onChange={(e) => updateSegment(r.id, { type: e.target.value })}
                          className="bg-[#1c1c22] border border-[#3a3a44] rounded px-1 py-0.5">
                          <option value="land">Land</option>
                          <option value="sea">Sea</option>
                          <option value="air">Air</option>
                        </select>
                        <span>×</span>
                        <input type="number" step="0.1" min="0.1" value={r.multiplier ?? 1}
                          onChange={(e) => updateSegment(r.id, { multiplier: Math.max(0.1, parseFloat(e.target.value) || 1) })}
                          className="w-14 bg-[#1c1c22] border border-[#3a3a44] rounded px-1 py-0.5" />
                        <span>pace</span>
                      </div>
                      <label className="flex items-center gap-1.5 mt-1.5 cursor-pointer">
                        <input type="checkbox" checked={!!r.unconventional} onChange={(e) => updateSegment(r.id, { unconventional: e.target.checked })} />
                        <span>unconventional route (excluded from travel calculator)</span>
                      </label>
                    </div>
                  );
                })}
              </div>
              <p className="text-[10px] text-[#8f8a7f] mt-1">amber dots are fork points · set a path's type so only matching travel modes use it, and bump its multiplier for rough terrain (2 = twice as slow)</p>
            </div>

            <div>
              <h2 className="text-base mb-2">Travel modes</h2>
              <div className="space-y-1">
                {data.travelModes.map((m) => (
                  <div key={m.id} className="flex items-center gap-2 text-xs">
                    <span className="w-20 text-[#8f8a7f]">{m.name}</span>
                    <input type="number" value={m.speed}
                      onChange={(e) => update({ travelModes: data.travelModes.map((x) => x.id === m.id ? { ...x, speed: parseFloat(e.target.value) || 0 } : x) })}
                      className="w-16 bg-[#1c1c22] border border-[#3a3a44] rounded px-1 py-0.5" />
                    <span className="text-[#8f8a7f]">mi/day, uses</span>
                    <select value={m.segType} onChange={(e) => update({ travelModes: data.travelModes.map((x) => x.id === m.id ? { ...x, segType: e.target.value } : x) })}
                      className="bg-[#1c1c22] border border-[#3a3a44] rounded px-1 py-0.5">
                      <option value="land">land</option>
                      <option value="sea">sea</option>
                      <option value="air">air</option>
                    </select>
                    <span className="text-[#8f8a7f]">paths</span>
                  </div>
                ))}
              </div>
            </div>

            <TravelCalculator data={data} highlightPath={highlightPath} onHighlight={setHighlightPath} />
          </div>

        </div>
      </div>
    </div>
  );
}

function AddCharForm({ onAdd }) {
  const [name, setName] = useState("");
  return (
    <div className="flex gap-2">
      <input value={name} onChange={(e) => setName(e.target.value)} placeholder="New character"
        className="flex-1 bg-[#1c1c22] border border-[#3a3a44] rounded px-2 py-1.5 text-xs"
        onKeyDown={(e) => { if (e.key === "Enter" && name.trim()) { onAdd(name); setName(""); } }} />
      <button onClick={() => { if (name.trim()) { onAdd(name); setName(""); } }} className="px-2 py-1.5 text-xs border border-[#3a3a44] rounded hover:border-[#8f8a7f]">+ Add</button>
    </div>
  );
}

function TravelCalculator({ data, highlightPath, onHighlight }) {
  const [fromId, setFromId] = useState("");
  const [toId, setToId] = useState("");
  const [modeId, setModeId] = useState(data.travelModes[0]?.id || "");
  const [result, setResult] = useState(null);
  const sortedLocations = [...data.locations].sort((a, b) => a.name.localeCompare(b.name));

  function calc() {
    const r = calculateTravel(data, fromId, toId, modeId);
    setResult(r);
    onHighlight(r && r.highlightPoints ? r.highlightPoints : null);
  }

  return (
    <div>
      <h2 className="text-base mb-2">Travel calculator</h2>
      <div className="space-y-2 text-xs">
        <select value={fromId} onChange={(e) => setFromId(e.target.value)} className="w-full bg-[#1c1c22] border border-[#3a3a44] rounded px-2 py-1.5">
          <option value="">From…</option>
          {sortedLocations.map((l) => <option key={l.id} value={l.id}>{l.name}</option>)}
        </select>
        <select value={toId} onChange={(e) => setToId(e.target.value)} className="w-full bg-[#1c1c22] border border-[#3a3a44] rounded px-2 py-1.5">
          <option value="">To…</option>
          {sortedLocations.map((l) => <option key={l.id} value={l.id}>{l.name}</option>)}
        </select>
        <select value={modeId} onChange={(e) => setModeId(e.target.value)} className="w-full bg-[#1c1c22] border border-[#3a3a44] rounded px-2 py-1.5">
          <option value="fastest">Fastest available (mix modes)</option>
          {data.travelModes.map((m) => <option key={m.id} value={m.id}>{m.name} ({m.speed}mi/day)</option>)}
        </select>
        <div className="flex gap-2">
          <button
            onClick={calc}
            disabled={!fromId || !toId}
            className="px-2 py-1 border border-[#3a3a44] rounded hover:border-[#8f8a7f] disabled:opacity-30"
          >
            Calculate
          </button>
          {highlightPath && (
            <button onClick={() => onHighlight(null)} className="px-2 py-1 border border-[#3a3a44] rounded hover:border-[#8f8a7f]">
              Clear highlight
            </button>
          )}
        </div>
        {result && (
          <div className="border border-[#3a3a44] rounded px-2 py-1.5 text-[#ece7dd]">
            {result.days !== undefined ? (
              <div>
                {result.miles != null && <div>{result.miles.toFixed(0)} miles</div>}
                <div>≈ {result.days} day{result.days === 1 ? "" : "s"}</div>
                {result.legs && result.legs.length > 0 && (
                  <div className="mt-1 space-y-0.5 text-[#8f8a7f]">
                    {result.legs.map((l, i) => (
                      <div key={i}>{l.modeName}: {l.fromName} → {l.toName} ({l.miles.toFixed(0)}mi)</div>
                    ))}
                  </div>
                )}
                {result.note && <div className="text-[#8f8a7f] italic mt-1">{result.note}</div>}
              </div>
            ) : (
              <div className="text-[#e0555f]">{result.note}</div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function PointsEditor({ charId, points, locations, onAdd, onUpdate, onRemove, onEdit, onClose }) {
  const [locId, setLocId] = useState("");
  const [startDay, setStartDay] = useState(1);
  const [endDay, setEndDay] = useState(1);
  const [note, setNote] = useState("");
  const locName = (id) => locations.find((l) => l.id === id)?.name || "?";
  const sortedLocations = [...locations].sort((a, b) => a.name.localeCompare(b.name));

  return (
    <div>
      <div className="flex items-center justify-between mb-2">
        <h2 className="text-base">Points</h2>
        <button onClick={onClose} className="text-xs text-[#8f8a7f] hover:text-[#ece7dd]">close ✕</button>
      </div>
      <div className="space-y-2 mb-3">
        {points.map((p) => (
          <div key={p.id} className="border border-[#3a3a44] rounded px-2 py-2 text-xs">
            <div className="flex items-center justify-between mb-1">
              <span onClick={() => onEdit(p.id)} className="cursor-pointer hover:underline">{locName(p.locationId)} · day {p.startDay}{p.endDay !== p.startDay ? `–${p.endDay}` : ""}</span>
              <button onClick={() => onRemove(p.id)} className="text-[#8f8a7f] hover:text-[#e0555f]">✕</button>
            </div>
            {p.note && <div className="text-[#8f8a7f] italic">{p.note}</div>}
          </div>
        ))}
        {points.length === 0 && <div className="text-xs text-[#8f8a7f] italic">No points yet — click the map in "Add point" mode, or add one below.</div>}
      </div>

      <div className="space-y-2 text-xs border-t border-[#3a3a44] pt-2">
        <div className="text-[#8f8a7f]">Add point without clicking the map:</div>
        <select value={locId} onChange={(e) => setLocId(e.target.value)} className="w-full bg-[#1c1c22] border border-[#3a3a44] rounded px-2 py-1.5">
          <option value="">Location…</option>
          {sortedLocations.map((l) => <option key={l.id} value={l.id}>{l.name}</option>)}
        </select>
        <div className="flex items-center gap-2">
          <span className="text-[#8f8a7f]">days</span>
          <input type="number" value={startDay} onChange={(e) => setStartDay(parseInt(e.target.value) || 1)} className="w-16 bg-[#1c1c22] border border-[#3a3a44] rounded px-2 py-1" />
          <span>–</span>
          <input type="number" value={endDay} onChange={(e) => setEndDay(parseInt(e.target.value) || 1)} className="w-16 bg-[#1c1c22] border border-[#3a3a44] rounded px-2 py-1" />
        </div>
        <textarea value={note} onChange={(e) => setNote(e.target.value)} placeholder="What's happening…" className="w-full bg-[#1c1c22] border border-[#3a3a44] rounded px-2 py-1.5 h-14" />
        <button disabled={!locId} onClick={() => { onAdd(charId, locId, startDay, endDay, note); setLocId(""); setNote(""); }}
          className="px-2 py-1 border border-[#3a3a44] rounded hover:border-[#8f8a7f] disabled:opacity-30">Add point</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
